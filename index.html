<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
    <div class="main">
        <div class="photo-container">
            <div class="photo-wrapper">
                <img src="tropical.jpg" alt="Photo of green fern leaves outside" class="green-photo">
                <div class="logo-overlay">
                    <img src="odin-lined.png" alt="logo of the odin project" id="left-logo">
                    <p id="right-logo">ODIN</p>
                </div>
            </div>
        </div>
    
        <div class="form-container">
            <div class="form-header">
                <h2>
                    This is not a real online service! You know you need something like this in your life
                    to help you realize your deepest dreams.<br>
                    Sign up <em>now</em> to get started.
                </h2>
                <h2>
                    You <em>know</em> you want to.
                </h2>
            </div>

            <form class="form" action="#" method="POST">
                <div class="inner-form">
                    <h2>Let's do this!</h2>

                <fieldset class="form-row">
                    <div>
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>

                    <div>
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                </fieldset>

                <fieldset class="form-row">
                    <div>
                        <label for="user_email">EMAIL</label>
                        <input type="email" id="user_email" name="user_email">
                    </div>

                    <div>
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" id="phone_number" name="phone_number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="XXX-XXX-XXXX" required>
                    </div>
                </fieldset>

                <fieldset class="form-row">
                    <div>
                        <label for="user_password">PASSWORD</label>
                        <input type="password" id="user_password" name="password" required>
                    </div>

                    <div>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="password" required>
                    </div>
                </fieldset>
                </div>

                <div class="signup-container">
                    <button type="submit" id="submitBtn">Create Account</button>
                    <p>Already have an account?<span id="green"> Log in</span></p>
                </div>
            </form>
        </div>
    </div> 
</body>
</html>
